[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mflow"
version = "0.1.0"
description = "Zero-shot foundation model forecasting of visitor flow in heritage museums with topology-constrained reconciliation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Shahab Anbarjafari", email = "shb@3sholding.com" }]
keywords = ["time-series", "forecasting", "foundation-models", "hierarchical-reconciliation", "museums"]

dependencies = [
  # Upper bound, not a preference: against numpy 2.5 every `pd.Timedelta(seconds=...)`
  # in pandas 2.3 raises a DeprecationWarning from inside pandas about the generic numpy
  # timedelta unit, and the warning says it becomes an error. The call is documented
  # pandas API and this project makes it on every panel, so the fix belongs upstream.
  # Revisit when pandas releases a version that is quiet against 2.5.
  "numpy>=1.26,<2.5",
  "pandas>=2.1",
  "polars>=1.0",
  "pyarrow>=15",
  "scipy>=1.11",
  "cvxpy>=1.5",
  "osqp>=0.6",
  "networkx>=3.2",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "pydantic>=2.6",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "psutil>=5.9",
  "tabulate>=0.9",
]

[project.optional-dependencies]
# Foundation models. Installed separately because each pulls large weights.
timesfm = ["timesfm>=3.0", "torch>=2.2"]
chronos = ["chronos-forecasting>=2.0"]
# The umbrella package is at 1.x and pulls in `toto-2>=2.0.0`, which provides the
# `toto2` module. Pinning it at >=2.0 asks PyPI for a release that does not exist.
toto = ["toto-models>=1.0"]
# Tier B continuous-space simulation.
continuous = ["jupedsim>=1.2"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
  "types-tabulate",
]

[project.scripts]
mflow = "mflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mflow = ["py.typed"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RET",  # return
  "ARG",  # unused arguments
  "PTH",  # pathlib
  "NPY",  # numpy legacy random
  "RUF",
  "BLE",  # blind except  -- "fail loudly" ground rule
  "TRY",  # exception antipatterns
]
ignore = [
  "TRY003",  # long messages outside exception class: we want specific errors
  "TRY300",  # return in try/else
  "RET504",  # named return value before return aids readability
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"scripts/*" = ["TRY301"]

[tool.ruff.lint.isort]
known-first-party = ["mflow"]

[tool.mypy]
# The pinned numpy ships stubs that use PEP 695 `type` statements, which mypy will only
# parse when told to target 3.12 or later. The runtime floor stays at 3.11.
python_version = "3.12"
files = ["src/mflow"]
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = ["mflow.forecast.foundation", "mflow.forecast.graphnn"]
# Optional heavy third-party deps are resolved at runtime.
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Tests needing downloaded weights or fetched datasets are opt-in: run them with
# `pytest -m requires_weights` once the artefacts are in place.
addopts = "-q --strict-markers -m 'not requires_weights and not requires_data'"
markers = [
  "slow: long-running tests (simulator sweeps, solver stress tests)",
  "requires_weights: needs foundation model weights downloaded from the Hugging Face Hub",
  "requires_data: needs a dataset fetched into data/raw",
]
filterwarnings = ["error::RuntimeWarning"]
